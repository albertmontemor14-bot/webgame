<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculus Adventure: The Math Kingdom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B0%3C/text%3E%3C/svg%3E">
<meta name="description" content="Calculus Adventure: The Math Kingdom, a pixel adventure game made with HTML, CSS and JavaScript.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css">
</head>
<body class="on-map">
  <!-- castle backgrounds, back to front (only visible inside a castle) -->
  <div class="layer sky"></div>
  <div class="layer stars"></div>
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="layer scenery mountains"></div>
  <div class="layer scenery hills"></div>
  <div class="layer scenery trees"></div>
  <div class="layer under"></div>
  <div class="torch" style="left:8%"></div>
  <div class="torch" style="left:32%"></div>
  <div class="torch" style="left:58%"></div>
  <div class="torch" style="left:84%"></div>

  <!-- overworld map -->
  <canvas id="map"></canvas>

  <!-- castle fight happens here -->
  <div id="world"></div>

  <div class="hud">
    <div class="left">
      <div class="hp" id="hp" role="img">
        <span class="heart" id="heart"></span>
        <div class="bar" id="bar"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
      </div>
      <div class="info" id="info"></div>
    </div>
    <div class="actions">
      <a class="btn" href="index.html">Home</a>
      <button class="btn" id="mode">Day / Night</button>
      <button class="btn" id="sound">Sound: On</button>
    </div>
  </div>

  <div class="help hmap">Arrows or WASD: walk<br>E: talk / open chest &middot; walk into a door to fight</div>
  <div class="help hcastle">A / D: move &middot; W or Space: jump<br>J: sword &middot; K or click: pistol &middot; R: reload</div>

  <div class="pad">
    <div class="grp">
      <button class="btn" data-act="left" aria-label="Move left">&#9664;</button>
      <button class="btn mapOnly" data-act="up" aria-label="Move up">&#9650;</button>
      <button class="btn mapOnly" data-act="down" aria-label="Move down">&#9660;</button>
      <button class="btn" data-act="right" aria-label="Move right">&#9654;</button>
    </div>
    <div class="grp castleOnly">
      <button class="btn" data-act="jump">Jump</button>
      <button class="btn" data-act="attack">Sword</button>
      <button class="btn gun" data-act="shoot">Gun</button>
    </div>
  </div>

  <div id="banner"></div>

  <div id="over">
    <h2>You fainted!</h2>
    <p>The zombies overran the castle.</p>
    <button class="btn" id="again">Try again</button>
    <button class="btn" id="leave">Leave castle</button>
  </div>

  <div id="fade"></div>

  <!-- loading screen -->
  <div id="loading">
    <div class="ld-stars"></div>
    <div class="ld-inner">
      <h1>Calculus Adventure</h1>
      <p class="ld-sub">The Math Kingdom</p>
      <div class="ld-row">
        <span class="heart" id="ldheart"></span>
        <div class="ld-bar"><i id="ldfill"></i></div>
      </div>
      <p class="ld-pct" id="ldpct">Loading 0%</p>
      <p class="ld-tip" id="ldtip"></p>
      <p class="ld-start" id="ldstart" hidden>Press any key or tap to start</p>
    </div>
  </div>

<script>
document.getElementById("mode").addEventListener("click", function () {
  var root = document.documentElement;
  var dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
});
</script>
<script src="music.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
